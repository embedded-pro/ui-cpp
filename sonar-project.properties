sonar.projectKey=embedded-pro_ui-cpp
sonar.organization=embedded-pro

sonar.projectName=ui-cpp
# x-release-please-start-version
sonar.projectVersion=0.0.1
# x-release-please-end

sonar.links.homepage=https://github.com/embedded-pro/ui-cpp
sonar.links.ci=https://github.com/embedded-pro/ui-cpp/actions
sonar.links.issue=https://github.com/embedded-pro/ui-cpp/issues
sonar.links.scm=https://github.com/embedded-pro/ui-cpp.git

sonar.sources=ui
sonar.exclusions=**/test/**

sonar.tests=ui
sonar.test.inclusions=**/test/**

sonar.sourceEncoding=UTF-8
sonar.c.file.suffixes=.c,.h
sonar.cpp.file.suffixes=.cpp,.hpp,.h

sonar.cfamily.compile-commands=compile_commands.json
sonar.cfamily.threads=2

sonar.testExecutionReportPaths=execution.xml
sonar.coverageReportPaths=coverage.xml

# Unlike the consumer repos, the UI is NOT excluded from coverage here — and as of the Qt backend
# that includes the backend, which has its own tests and is built by the analysis run. Excluding it
# discarded real measurements and was why new-code coverage reported 0.0%.
# sonar.coverage.exclusions is deliberately unset.

# Project specific ignored rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# Access specifiers should not be redundant [cpp:S3539]
#
# We allow duplicate access specifiers to distinguish between 'logical' blocks
# (i.e. separate private methods from private variables)
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S3539
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.?pp

# Methods should not be empty [cpp:S1186]
#
# InputHandler's default event handlers are deliberately empty so that a widget
# overrides only the events it cares about.
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.?pp

# "std::move" and "std::forward" should not be confused [cpp:S5417]
#
# SonarQube incorrectly flags usages of std::forward in template code.
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S5417
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.?pp

# Replace this "std::function" with a template parameter. [cpp:S5213]
#
# ui::Callback exists precisely to avoid templating every widget on its
# notification type; that is the design, not an oversight.
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:S5213
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.?pp

# Variables should not be shadowed [cpp:S1117]
#
# We allow shadowing of variables in case they need to be stored for later use.
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:S1117
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.?pp

# "if","switch", and range-based for loop initializer should be used to reduce scope of variables [cpp:S6004]
#
# Although C++17 introduced a construct to initialize variables inside of an "if" or "switch"
# statement, due to the reduced readability this construct should not be used by default
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S6004
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.?pp
